<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PMA • Peningkatan Mutu Akademik • SIGULAS</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #eef2f7, #f8faff);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            width: 100%;
            background: white;
            border-radius: 24px;
            padding: 40px 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
            position: relative;
        }

        /* Tombol Kembali */
        .back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #eef2f7;
            padding: 8px 18px;
            border-radius: 40px;
            text-decoration: none;
            color: #1e3a6f;
            font-weight: 700;
            font-size: 13px;
            transition: 0.2s;
            border: none;
            cursor: pointer;
            z-index: 10;
        }
        .back-btn:hover {
            background: #dce3ed;
            transform: scale(1.02);
        }
        .back-btn:active {
            transform: scale(0.96);
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 32px;
            padding-top: 6px;
        }

        .header .icon-big {
            font-size: 56px;
            display: block;
            margin-bottom: 8px;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 800;
            color: #1e3a6f;
            letter-spacing: -0.5px;
        }

        .header .sub {
            font-size: 15px;
            color: #5a6f8a;
            margin-top: 2px;
            font-weight: 500;
        }

        .header .badge {
            display: inline-block;
            background: #1e3a6f;
            color: white;
            padding: 4px 16px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: 600;
            margin-top: 8px;
        }

        /* Grid Submenu */
        .submenu-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 18px;
            margin-top: 10px;
        }

        .submenu-item {
            background: #f8faff;
            border: 2px solid #eef2f7;
            border-radius: 20px;
            padding: 28px 16px 22px;
            text-align: center;
            cursor: pointer;
            transition: all 0.25s ease;
            text-decoration: none;
            color: #1e3a6f;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            position: relative;
            overflow: hidden;
        }
        .submenu-item::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #1e3a6f, #4a7cb5);
            opacity: 0;
            transition: opacity 0.3s;
        }
        .submenu-item:hover::before {
            opacity: 1;
        }
        .submenu-item:hover {
            transform: translateY(-6px);
            border-color: #1e3a6f;
            background: #f0f4ff;
            box-shadow: 0 10px 24px rgba(30, 58, 111, 0.12);
        }
        .submenu-item:active {
            transform: scale(0.96);
        }

        .submenu-item .icon-wrapper {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: linear-gradient(135deg, #e8f0fe, #d4e2f7);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            transition: transform 0.3s;
        }
        .submenu-item:hover .icon-wrapper {
            transform: scale(1.08) rotate(-4deg);
        }

        .submenu-item .label {
            font-weight: 700;
            font-size: 15px;
            color: #1e3a6f;
        }

        .submenu-item .desc {
            font-size: 12px;
            color: #7a8ea8;
            line-height: 1.4;
        }

        .submenu-item .arrow {
            font-size: 14px;
            color: #7a8ea8;
            transition: transform 0.3s;
        }
        .submenu-item:hover .arrow {
            transform: translateX(4px);
            color: #1e3a6f;
        }

        /* Warna icon wrapper per item */
        .item-soal .icon-wrapper {
            background: linear-gradient(135deg, #fff3e0, #ffe0b2);
        }
        .item-dokumentasi .icon-wrapper {
            background: linear-gradient(135deg, #e8f5e9, #c8e6c9);
        }
        .item-materi .icon-wrapper {
            background: linear-gradient(135deg, #e3f2fd, #bbdefb);
        }
        .item-bank .icon-wrapper {
            background: linear-gradient(135deg, #fce4ec, #f8bbd0);
        }

        /* Footer note */
        .footer-note {
            text-align: center;
            margin-top: 28px;
            font-size: 12px;
            color: #a0b2c9;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .container {
                padding: 30px 16px;
            }
            .back-btn {
                position: static;
                margin-bottom: 16px;
                display: inline-flex;
            }
            .header h1 {
                font-size: 22px;
            }
            .header .icon-big {
                font-size: 44px;
            }
            .submenu-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 14px;
            }
            .submenu-item {
                padding: 22px 12px 18px;
            }
            .submenu-item .icon-wrapper {
                width: 54px;
                height: 54px;
                font-size: 26px;
            }
            .submenu-item .label {
                font-size: 14px;
            }
            .submenu-item .desc {
                font-size: 11px;
            }
        }

        @media (max-width: 400px) {
            .submenu-grid {
                grid-template-columns: 1fr 1fr;
                gap: 10px;
            }
            .submenu-item {
                padding: 16px 8px 14px;
            }
            .submenu-item .icon-wrapper {
                width: 46px;
                height: 46px;
                font-size: 22px;
            }
            .submenu-item .label {
                font-size: 12px;
            }
            .submenu-item .desc {
                font-size: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">

        <!-- Tombol Kembali ke Beranda SIGULAS -->
        <a href="index.html" class="back-btn">
            <i class="fas fa-arrow-left"></i> Kembali ke Beranda
        </a>

        <!-- Header -->
        <div class="header">
            <span class="icon-big">📈</span>
            <h1>PMA</h1>
            <div class="sub">Peningkatan Mutu Akademik</div>
            <span class="badge">SMP Negeri 17 Surabaya</span>
        </div>

        <!-- Submenu Grid -->
        <div class="submenu-grid">
            <!-- 1. Pengumpulan Soal -->
            <a href="#" target="_blank" rel="noopener" class="submenu-item item-soal" id="submenu-soal">
                <div class="icon-wrapper"><i class="fas fa-file-alt"></i></div>
                <span class="label">Pengumpulan Soal</span>
                <span class="desc">Kumpulkan soal UH, PTS, PAS</span>
                <span class="arrow"><i class="fas fa-chevron-right"></i></span>
            </a>

            <!-- 2. Dokumentasi -->
            <a href="#" target="_blank" rel="noopener" class="submenu-item item-dokumentasi" id="submenu-dokumentasi">
                <div class="icon-wrapper"><i class="fas fa-camera"></i></div>
                <span class="label">Dokumentasi</span>
                <span class="desc">Foto &amp; video kegiatan akademik</span>
                <span class="arrow"><i class="fas fa-chevron-right"></i></span>
            </a>

            <!-- 3. Materi -->
            <a href="#" target="_blank" rel="noopener" class="submenu-item item-materi" id="submenu-materi">
                <div class="icon-wrapper"><i class="fas fa-book-open"></i></div>
                <span class="label">Materi</span>
                <span class="desc">Bahan ajar &amp; modul pembelajaran</span>
                <span class="arrow"><i class="fas fa-chevron-right"></i></span>
            </a>

            <!-- 4. Bank Soal (Arsip) -->
            <a href="#" target="_blank" rel="noopener" class="submenu-item item-bank" id="submenu-bank">
                <div class="icon-wrapper"><i class="fas fa-archive"></i></div>
                <span class="label">Bank Soal (Arsip)</span>
                <span class="desc">Kumpulan soal tahun sebelumnya</span>
                <span class="arrow"><i class="fas fa-chevron-right"></i></span>
            </a>
        </div>

        <div class="footer-note">
            Klik submenu untuk membuka tautan di tab baru.
        </div>
    </div>

    <script>
        // ============================================================
        //  GANTI LINK DI BAWAH INI DENGAN URL ASLI MASING-MASING
        // ============================================================
        const LINKS = {
            'soal': 'https://docs.google.com/forms/d/placeholder-pengumpulan-soal',
            'dokumentasi': 'https://drive.google.com/drive/folders/placeholder-dokumentasi',
            'materi': 'https://drive.google.com/drive/folders/placeholder-materi',
            'bank': 'https://drive.google.com/drive/folders/placeholder-bank-soal'
        };

        // Set href untuk setiap submenu
        document.getElementById('submenu-soal').href = LINKS['soal'];
        document.getElementById('submenu-dokumentasi').href = LINKS['dokumentasi'];
        document.getElementById('submenu-materi').href = LINKS['materi'];
        document.getElementById('submenu-bank').href = LINKS['bank'];

        // Jika link masih placeholder, beri notifikasi saat diklik
        document.querySelectorAll('.submenu-item').forEach(item => {
            item.addEventListener('click', function(e) {
                const href = this.getAttribute('href');
                if (href === '#' || href.includes('placeholder')) {
                    e.preventDefault();
                    alert('🔗 Link belum diatur. Silakan ganti placeholder dengan URL asli di file pma.html.');
                }
            });
        });
    </script>
</body>
</html>
