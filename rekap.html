<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rekap Absensi • SIGULAS</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        }

        /* ===== BODY DENGAN BACKGROUND HIJAU GELAP (KONTRAST DENGAN CONTAINER) ===== */
        body {
            background: #0a3d0a;  /* Hijau sangat gelap, kontras tinggi */
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* Container putih bersih dengan bayangan tebal */
        .container {
            max-width: 700px;
            width: 100%;
            background: #ffffff;
            border-radius: 24px;
            padding: 40px 30px;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.35);
            position: relative;
        }

        /* Tombol Kembali - menggunakan hijau tua */
        .back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #f0f7f0;
            padding: 8px 18px;
            border-radius: 40px;
            text-decoration: none;
            color: #0a3d0a;
            font-weight: 700;
            font-size: 13px;
            transition: 0.2s;
            border: 2px solid #c8e0c8;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            z-index: 10;
        }
        .back-btn:hover {
            background: #ffffff;
            transform: scale(1.02);
            border-color: #0a3d0a;
            box-shadow: 0 4px 12px rgba(10, 61, 10, 0.15);
        }
        .back-btn:active {
            transform: scale(0.96);
        }

        .page-icon {
            font-size: 60px;
            display: block;
            text-align: center;
            margin: 30px 0 10px;
        }

        h1 {
            font-size: 28px;
            font-weight: 800;
            color: #0a3d0a;
            text-align: center;
            margin-bottom: 6px;
        }

        .sub {
            text-align: center;
            color: #3d6b3d;
            font-size: 14px;
            margin-bottom: 30px;
        }

        /* Grid submenu – 3 kolom */
        .submenu-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 14px;
        }

        .submenu-item {
            background: #f5faf5;
            border: 2px solid #d0e6d0;
            border-radius: 16px;
            padding: 24px 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
            color: #0a3d0a;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }
        .submenu-item:hover {
            transform: translateY(-4px);
            border-color: #0a3d0a;
            background: #e6f5e6;
            box-shadow: 0 6px 16px rgba(10, 61, 10, 0.10);
        }
        .submenu-item:active {
            transform: scale(0.96);
        }
        .submenu-item .sub-icon {
            font-size: 32px;
        }
        .submenu-item .sub-label {
            font-weight: 700;
            font-size: 14px;
        }
        .submenu-item .sub-desc {
            font-size: 11px;
            color: #3d6b3d;
            line-height: 1.3;
        }

        .footer-note {
            text-align: center;
            margin-top: 24px;
            font-size: 12px;
            color: #3d6b3d;
        }

        /* Responsive */
        @media (max-width: 600px) {
            .container { padding: 30px 16px; }
            .back-btn { position: static; margin-bottom: 16px; display: inline-flex; }
            h1 { font-size: 22px; }
            .page-icon { font-size: 48px; margin-top: 10px; }
            .submenu-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
            .submenu-item:last-child { grid-column: span 2; }
        }

        @media (max-width: 480px) {
            .submenu-grid { grid-template-columns: 1fr; gap: 10px; }
            .submenu-item:last-child { grid-column: span 1; }
            .submenu-item { padding: 18px 10px; }
            .submenu-item .sub-icon { font-size: 26px; }
            .submenu-item .sub-label { font-size: 13px; }
            .submenu-item .sub-desc { font-size: 11px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Tombol Kembali ke Beranda SIGULAS -->
        <a href="index.html" class="back-btn">← Kembali ke Beranda</a>

        <span class="page-icon">📊</span>
        <h1>Rekap Absensi</h1>
        <p class="sub">Pilih jenis rekap yang ingin Anda lihat atau unduh.</p>

        <div class="submenu-grid">
            <!-- 1. Rekap Harian Kelas -->
            <a href="#" target="_blank" rel="noopener" class="submenu-item" id="submenu-harian-kelas">
                <span class="sub-icon">📋</span>
                <span class="sub-label">Rekap Harian Kelas</span>
                <span class="sub-desc">Per kelas per hari</span>
            </a>

            <!-- 2. Rekap Harian Sekolah -->
            <a href="#" target="_blank" rel="noopener" class="submenu-item" id="submenu-harian-sekolah">
                <span class="sub-icon">🏫</span>
                <span class="sub-label">Rekap Harian Sekolah</span>
                <span class="sub-desc">Semua kelas dalam satu hari</span>
            </a>

            <!-- 3. Rekap Bulanan & Semester -->
            <a href="#" target="_blank" rel="noopener" class="submenu-item" id="submenu-bulanan-semester">
                <span class="sub-icon">📆</span>
                <span class="sub-label">Rekap Bulanan &amp; Semester</span>
                <span class="sub-desc">Bulanan dan semester ganjil/genap</span>
            </a>
        </div>

        <div class="footer-note">
            Klik submenu untuk membuka tautan rekap di tab baru.
        </div>
    </div>

    <script>
        // ============================================================
        //  GANTI LINK DI BAWAH INI DENGAN URL ASLI MASING-MASING REKAP
        // ============================================================
        const LINKS = {
            'harian-kelas': 'https://sites.google.com/guru.smp.belajar.id/rekap-harian/rekap-absensi-harian',
            'harian-sekolah': 'https://sites.google.com/guru.smp.belajar.id/rekap-sekolah/rekap-sekolah',
            'bulanan-semester': 'https://sites.google.com/guru.smp.belajar.id/rekap-bulanan/rekap-bulanan'
        };

        document.getElementById('submenu-harian-kelas').href = LINKS['harian-kelas'];
        document.getElementById('submenu-harian-sekolah').href = LINKS['harian-sekolah'];
        document.getElementById('submenu-bulanan-semester').href = LINKS['bulanan-semester'];

        document.querySelectorAll('.submenu-item').forEach(item => {
            item.addEventListener('click', function(e) {
                const href = this.getAttribute('href');
                if (href === '#' || href.includes('placeholder')) {
                    e.preventDefault();
                    alert('🔗 Link rekap belum diatur. Silakan ganti placeholder dengan URL asli di file rekap.html.');
                }
            });
        });
    </script>
</body>
</html>
